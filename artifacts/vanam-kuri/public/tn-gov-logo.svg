<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tamil Nadu Government Emblem - Stylized Lion Capital (Ashoka Pillar) -->
  <defs>
    <linearGradient id="goldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="50%" stop-color="#C49B38"/>
      <stop offset="100%" stop-color="#A07E2A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0D3B13"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Circle Border -->
  <circle cx="100" cy="100" r="96" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
  <circle cx="100" cy="100" r="90" stroke="url(#goldGrad)" stroke-width="1" fill="none"/>
  
  <!-- Inner Shield Background -->
  <circle cx="100" cy="100" r="86" fill="url(#shieldGrad)"/>
  
  <!-- Ashoka Pillar Capital (Stylized) -->
  <!-- Base Platform -->
  <rect x="72" y="110" width="56" height="6" rx="2" fill="url(#goldGrad)"/>
  <rect x="78" y="116" width="44" height="4" rx="1" fill="url(#goldGrad)" opacity="0.8"/>
  
  <!-- Pillar Body -->
  <rect x="88" y="72" width="24" height="38" rx="3" fill="url(#goldGrad)"/>
  
  <!-- Abacus (decorated band) -->
  <rect x="82" y="66" width="36" height="8" rx="2" fill="url(#goldGrad)"/>
  <!-- Dharma Wheel on Abacus -->
  <circle cx="100" cy="70" r="3" stroke="#1B5E20" stroke-width="1" fill="none"/>
  <line x1="100" y1="67" x2="100" y2="73" stroke="#1B5E20" stroke-width="0.5"/>
  <line x1="97" y1="70" x2="103" y2="70" stroke="#1B5E20" stroke-width="0.5"/>
  
  <!-- Lion Capital (Center lion facing forward) -->
  <!-- Lion Head -->
  <ellipse cx="100" cy="54" rx="10" ry="8" fill="url(#goldGrad)"/>
  <!-- Mane -->
  <path d="M88 52 C86 46, 90 40, 100 38 C110 40, 114 46, 112 52" fill="url(#goldGrad)"/>
  <!-- Lion Face Details -->
  <circle cx="96" cy="52" r="1.2" fill="#1B5E20"/>
  <circle cx="104" cy="52" r="1.2" fill="#1B5E20"/>
  <path d="M97 56 Q100 58 103 56" stroke="#1B5E20" stroke-width="0.8" fill="none"/>
  
  <!-- Side Lions (simplified) -->
  <!-- Left Lion -->
  <ellipse cx="82" cy="60" rx="6" ry="5" fill="url(#goldGrad)" opacity="0.7"/>
  <!-- Right Lion -->
  <ellipse cx="118" cy="60" rx="6" ry="5" fill="url(#goldGrad)" opacity="0.7"/>
  
  <!-- Text: "GOVERNMENT OF" -->
  <text x="100" y="138" text-anchor="middle" font-family="serif" font-size="8" font-weight="bold" fill="#D4A843" letter-spacing="2">GOVERNMENT OF</text>
  
  <!-- Text: "TAMIL NADU" -->
  <text x="100" y="150" text-anchor="middle" font-family="serif" font-size="11" font-weight="bold" fill="#D4A843" letter-spacing="3">TAMIL NADU</text>
  
  <!-- Text: Tamil Script -->
  <text x="100" y="164" text-anchor="middle" font-family="serif" font-size="9" fill="#D4A843">தமிழ்நாடு அரசு</text>
  
  <!-- Decorative Laurel Leaves (Left) -->
  <path d="M30 130 C35 120, 45 115, 50 100 C48 115, 40 122, 35 130" fill="#2E7D32" opacity="0.8"/>
  <path d="M26 140 C32 128, 42 122, 48 108 C46 123, 37 131, 30 140" fill="#388E3C" opacity="0.7"/>
  <path d="M24 150 C30 138, 40 132, 46 118 C44 133, 35 141, 28 150" fill="#43A047" opacity="0.6"/>
  
  <!-- Decorative Laurel Leaves (Right) -->
  <path d="M170 130 C165 120, 155 115, 150 100 C152 115, 160 122, 165 130" fill="#2E7D32" opacity="0.8"/>
  <path d="M174 140 C168 128, 158 122, 152 108 C154 123, 163 131, 170 140" fill="#388E3C" opacity="0.7"/>
  <path d="M176 150 C170 138, 160 132, 154 118 C156 133, 165 141, 172 150" fill="#43A047" opacity="0.6"/>
  
  <!-- Bottom Scroll Banner -->
  <path d="M55 172 Q100 180 145 172 Q148 176 145 180 Q100 188 55 180 Q52 176 55 172Z" fill="url(#goldGrad)" opacity="0.9"/>
  <text x="100" y="179" text-anchor="middle" font-family="serif" font-size="6.5" font-weight="bold" fill="#0D3B13" letter-spacing="1">VANAM KURI</text>
</svg>
