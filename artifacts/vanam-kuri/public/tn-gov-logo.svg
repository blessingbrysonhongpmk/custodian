<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold Gradient for Outer Ring & Gopuram -->
    <linearGradient id="tnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E274"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#785B00"/>
    </linearGradient>

    <!-- Deep Forest Green Background -->
    <radialGradient id="tnBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E4A28"/>
      <stop offset="70%" stop-color="#08331A"/>
      <stop offset="100%" stop-color="#041F0E"/>
    </radialGradient>

    <!-- Inner Cream Temple Background -->
    <linearGradient id="tnInner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#F5ECCE"/>
    </linearGradient>

    <!-- Curvature paths for text -->
    <path id="topTextArc" d="M 28 120 A 92 92 0 0 1 212 120" />
    <path id="bottomTextArc" d="M 38 135 A 88 88 0 0 0 202 135" />
  </defs>

  <!-- Outer Ring Shadow & Base -->
  <circle cx="120" cy="120" r="116" fill="#041A0C" stroke="url(#tnGold)" stroke-width="4"/>
  <circle cx="120" cy="120" r="110" fill="url(#tnBg)"/>
  
  <!-- Outer Beaded Pattern (Traditional Indian Coin / Seal border) -->
  <circle cx="120" cy="120" r="105" stroke="url(#tnGold)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="120" cy="120" r="82" stroke="url(#tnGold)" stroke-width="2"/>

  <!-- Top Text: தமிழ்நாடு அரசு -->
  <text fill="url(#tnGold)" font-family="'Noto Sans Tamil', 'Latha', 'Mukta Malar', 'Tamil Sangam MN', sans-serif" font-size="14.5" font-weight="bold" letter-spacing="3.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      தமிழ்நாடு அரசு
    </textPath>
  </text>

  <!-- Bottom Text: வாய்மையே வெல்லும் -->
  <text fill="#FFFDF5" font-family="'Noto Sans Tamil', 'Latha', 'Mukta Malar', 'Tamil Sangam MN', sans-serif" font-size="11.5" font-weight="bold" letter-spacing="2">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      வாய்மையே வெல்லும்
    </textPath>
  </text>

  <!-- Side Stars / Decorative Marks -->
  <polygon points="32,120 34,124 38,124 35,127 36,131 32,128 28,131 29,127 26,124 30,124" fill="url(#tnGold)"/>
  <polygon points="208,120 210,124 214,124 211,127 212,131 208,128 204,131 205,127 202,124 206,124" fill="url(#tnGold)"/>

  <!-- Inner Medallion: Srivilliputhur Andal Temple Gopuram + Lion Capital -->
  <circle cx="120" cy="116" r="62" fill="url(#tnInner)" stroke="url(#tnGold)" stroke-width="2.5"/>

  <!-- Subtle Radiating Rays from behind Gopuram -->
  <g opacity="0.18" stroke="#AA820A" stroke-width="1">
    <line x1="120" y1="116" x2="70" y2="70" />
    <line x1="120" y1="116" x2="85" y2="60" />
    <line x1="120" y1="116" x2="100" y2="55" />
    <line x1="120" y1="116" x2="120" y2="54" />
    <line x1="120" y1="116" x2="140" y2="55" />
    <line x1="120" y1="116" x2="155" y2="60" />
    <line x1="120" y1="116" x2="170" y2="70" />
  </g>

  <!-- ================= Srivilliputhur Andal Temple Tower (Gopuram) ================= -->
  <!-- Kalasams (Finials on top) -->
  <g fill="url(#tnGold)">
    <circle cx="120" cy="62" r="2.2" />
    <polygon points="119,62 121,62 120.5,58 119.5,58" />
    
    <circle cx="114" cy="63.5" r="1.8" />
    <circle cx="126" cy="63.5" r="1.8" />
    
    <circle cx="108" cy="65.5" r="1.5" />
    <circle cx="132" cy="65.5" r="1.5" />
  </g>

  <!-- Gopuram Crest / Barrel Vault (Shikhara) -->
  <path d="M103 68 C103 64, 137 64, 137 68 L139 72 L101 72 Z" fill="url(#tnGold)" stroke="#614603" stroke-width="0.5"/>

  <!-- Tier 1 (Topmost tier) -->
  <rect x="104" y="73" width="32" height="4" rx="0.5" fill="url(#tnGold)" stroke="#614603" stroke-width="0.5"/>
  <rect x="117" y="74" width="6" height="2.5" fill="#422E02"/>

  <!-- Tier 2 -->
  <rect x="101" y="78" width="38" height="4.5" rx="0.5" fill="url(#tnGold)" stroke="#614603" stroke-width="0.5"/>
  <rect x="111" y="79" width="4" height="3" fill="#422E02"/>
  <rect x="118" y="79" width="4" height="3" fill="#422E02"/>
  <rect x="125" y="79" width="4" height="3" fill="#422E02"/>

  <!-- Tier 3 -->
  <rect x="98" y="83.5" width="44" height="5" rx="0.5" fill="url(#tnGold)" stroke="#614603" stroke-width="0.5"/>
  <circle cx="104" cy="86" r="1.2" fill="#422E02"/>
  <circle cx="112" cy="86" r="1.2" fill="#422E02"/>
  <circle cx="120" cy="86" r="1.2" fill="#422E02"/>
  <circle cx="128" cy="86" r="1.2" fill="#422E02"/>
  <circle cx="136" cy="86" r="1.2" fill="#422E02"/>

  <!-- Tier 4 -->
  <rect x="95" y="89.5" width="50" height="5.5" rx="0.5" fill="url(#tnGold)" stroke="#614603" stroke-width="0.5"/>
  <rect x="102" y="91" width="4" height="3" fill="#422E02"/>
  <rect x="111" y="91" width="4" height="3" fill="#422E02"/>
  <rect x="118" y="91" width="4" height="3" fill="#422E02"/>
  <rect x="125" y="91" width="4" height="3" fill="#422E02"/>
  <rect x="134" y="91" width="4" height="3" fill="#422E02"/>

  <!-- Tier 5 -->
  <rect x="92" y="96" width="56" height="6" rx="0.5" fill="url(#tnGold)" stroke="#614603" stroke-width="0.5"/>
  <circle cx="98" cy="99" r="1.4" fill="#422E02"/>
  <circle cx="107" cy="99" r="1.4" fill="#422E02"/>
  <circle cx="116" cy="99" r="1.4" fill="#422E02"/>
  <circle cx="124" cy="99" r="1.4" fill="#422E02"/>
  <circle cx="133" cy="99" r="1.4" fill="#422E02"/>
  <circle cx="142" cy="99" r="1.4" fill="#422E02"/>

  <!-- Tier 6 -->
  <rect x="89" y="103" width="62" height="6.5" rx="0.5" fill="url(#tnGold)" stroke="#614603" stroke-width="0.5"/>
  <rect x="96" y="105" width="4.5" height="3.5" fill="#422E02"/>
  <rect x="106" y="105" width="4.5" height="3.5" fill="#422E02"/>
  <rect x="117.5" y="105" width="5" height="3.5" fill="#422E02"/>
  <rect x="129" y="105" width="4.5" height="3.5" fill="#422E02"/>
  <rect x="139" y="105" width="4.5" height="3.5" fill="#422E02"/>

  <!-- Tier 7 (Lower Broad Base of Gopuram) -->
  <rect x="85" y="110.5" width="70" height="7" rx="0.5" fill="url(#tnGold)" stroke="#614603" stroke-width="0.5"/>
  
  <!-- Gopuram Gateway (Arched Entrance) -->
  <!-- Base Plinth -->
  <path d="M83 118 L157 118 L155 148 L85 148 Z" fill="url(#tnGold)" stroke="#614603" stroke-width="0.7"/>
  
  <!-- Central Arched Niche -->
  <path d="M102 148 L102 126 Q120 120 138 126 L138 148 Z" fill="#0A381C" stroke="#AA820A" stroke-width="1"/>

  <!-- ================= Ashoka Lion Capital (inside / at base of arch) ================= -->
  <!-- Circular Abacus with Dharma Wheel -->
  <rect x="108" y="141" width="24" height="4" rx="1" fill="url(#tnGold)"/>
  <!-- Ashoka Chakra (Dharma wheel) -->
  <circle cx="120" cy="143" r="2.2" stroke="#0A381C" stroke-width="0.8" fill="none"/>
  <circle cx="120" cy="143" r="0.6" fill="#0A381C"/>

  <!-- Ashoka Lions -->
  <!-- Center Lion -->
  <ellipse cx="120" cy="133" rx="4.8" ry="4.5" fill="url(#tnGold)"/>
  <path d="M115 132 C114 128, 117 125, 120 125 C123 125, 126 128, 125 132" fill="url(#tnGold)"/>
  <!-- Lion facial details -->
  <circle cx="118.5" cy="132" r="0.6" fill="#0A381C"/>
  <circle cx="121.5" cy="132" r="0.6" fill="#0A381C"/>
  <line x1="120" y1="133" x2="120" y2="135" stroke="#0A381C" stroke-width="0.6"/>

  <!-- Left Lion -->
  <ellipse cx="111.5" cy="134.5" rx="3.2" ry="3.5" fill="url(#tnGold)" opacity="0.9"/>
  <!-- Right Lion -->
  <ellipse cx="128.5" cy="134.5" rx="3.2" ry="3.5" fill="url(#tnGold)" opacity="0.9"/>

  <!-- Ornamental Garland / Grain Stalks at Bottom of Seal -->
  <path d="M78 147 Q120 162 162 147" stroke="url(#tnGold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="120" cy="155" r="3" fill="url(#tnGold)"/>

  <!-- Inner Circular Border Ring -->
  <circle cx="120" cy="116" r="61" stroke="#AA820A" stroke-width="0.8" fill="none"/>
</svg>
