kind = "web"
previewPath = "/"
title = "Vanam Kuri"
description = "A tree plantation accountability platform for India, showing custody chains, peer verification, community caretaker groups, and tree survival stories through a polished ward-level demo."
version = "1.0.0"
id = "artifacts/vanam-kuri"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24647

[services.development]
run = "pnpm --filter @workspace/vanam-kuri run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vanam-kuri", "run", "build" ]
serve = "static"
publicDir = "artifacts/vanam-kuri/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24647"
BASE_PATH = "/"
